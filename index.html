<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>PAPAN STEREK DIGITAL</title>

  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <!-- iOS FULLSCREEN -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aplikasi">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
    }

    /* Layar Login */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 3px solid #1a2980;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      color: #1a2980;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .password-container {
      position: relative;
      margin-bottom: 25px;
    }

    input[type="password"] {
      width: 100%;
      padding: 15px 20px;
      padding-right: 50px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: #1a2980;
      box-shadow: 0 0 0 3px rgba(26, 41, 128, 0.1);
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 18px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(26, 41, 128, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      color: #e74c3c;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    /* Layar Konten */
    #content-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .logout-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(26, 41, 128, 0.9);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      z-index: 1001;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: rgba(26, 41, 128, 1);
      transform: scale(1.05);
    }

    /* Loading */
    .loading {
      display: none;
      margin-top: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1a2980;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Timer Display */
    .timer-container {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 1002;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .timer-icon {
      font-size: 12px;
    }

    #timer-display {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 15px;
    }

    .timer-warning {
      color: #ff6b6b !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
        margin: 20px;
      }
      
      .logo {
        width: 80px;
        height: 80px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .timer-container {
        top: 15px;
        left: 15px;
        padding: 6px 12px;
        font-size: 12px;
      }
      
      #timer-display {
        font-size: 13px;
      }
    }

    /* Fallback untuk logo jika gambar gagal load */
    .logo-fallback {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- Layar Login -->
  <div id="login-screen">
    <div class="login-container">
      <div class="logo">
        <img src="https://raw.githubusercontent.com/drivelapas-del/lapasbaubau/refs/heads/main/LOG-QR%20PUTIH.png" 
             alt="Logo Papan Sterek Digital" 
             class="logo-img"
             onerror="this.onerror=null; this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';">
        <div class="logo-fallback" style="display: none;">PSD</div>
      </div>
      <h1>PAPAN STEREK DIGITAL</h1>
      <p class="subtitle">Lembaga Pemasyarakatan Kelas IIA Baubau</p>
      
      <div class="password-container">
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
        <button type="button" class="toggle-password" id="toggle-password">👁️</button>
      </div>
      
      <button class="login-btn" id="login-btn">MASUK</button>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>
      
      <div class="error-message" id="error-message"></div>
    </div>
  </div>

  <!-- Layar Konten -->
  <div id="content-screen">
    <!-- Timer Display -->
    <div class="timer-container">
      <span class="timer-icon">⏰</span>
      <span id="timer-display">10:00</span>
    </div>
    
    <button class="logout-btn" id="logout-btn">KELUAR</button>
    <iframe 
      src="https://script.google.com/macros/s/AKfycbyyfIljChe6HNMUniBcXaRRnBODmcnLVILqGIATBVgDgrv12AQMfMz6hcfeISeFXnLsUQ/exec"
      allowfullscreen
      id="main-frame">
    </iframe>
  </div>

  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    // Password yang valid
    const VALID_PASSWORD = "psd2026"; // GANTI PASSWORD INI
    
    // Auto-logout timeout (10 menit dalam milidetik)
    const AUTO_LOGOUT_TIMEOUT = 10 * 60 * 1000; // 10 menit
    
    // DOM Elements
    const loginScreen = document.getElementById('login-screen');
    const contentScreen = document.getElementById('content-screen');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const logoutBtn = document.getElementById('logout-btn');
    const errorMessage = document.getElementById('error-message');
    const loading = document.getElementById('loading');
    const mainFrame = document.getElementById('main-frame');
    const timerDisplay = document.getElementById('timer-display');
    const timerContainer = document.querySelector('.timer-container');
    const logoImg = document.querySelector('.logo-img');
    
    // Variabel untuk auto-logout
    let lastActivityTime = Date.now();
    let inactivityTimer;
    let countdownInterval;
    let remainingTime = AUTO_LOGOUT_TIMEOUT;
    let isLoggedIn = false;

    // Preload logo untuk menghindari flash saat loading
    logoImg.onload = function() {
      console.log('Logo berhasil dimuat');
    };
    
    logoImg.onerror = function() {
      console.log('Gagal memuat logo, menggunakan fallback');
    };

    // Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      if (isLoggedIn) {
        showContent();
        startAutoLogoutTimer();
      }
      
      // Paksa hide address bar di Android
      setTimeout(() => {
        window.scrollTo(0, 1);
      }, 0);
      
      // Setup event listeners untuk aktivitas
      setupActivityListeners();
    });

    // Setup event listeners untuk mendeteksi aktivitas
    function setupActivityListeners() {
      const activityEvents = [
        'mousedown', 'mousemove', 'keydown', 'scroll', 
        'touchstart', 'click', 'keypress', 'wheel',
        'input', 'change', 'focus', 'blur'
      ];
      
      activityEvents.forEach(event => {
        document.addEventListener(event, () => resetAutoLogoutTimer(), { passive: true });
      });
      
      // Deteksi aktivitas dalam iframe menggunakan MutationObserver
      setupIframeActivityDetection();
      
      // Deteksi perubahan visibility tab
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          resetAutoLogoutTimer();
        }
      });
    }

    // Setup deteksi aktivitas dalam iframe
    function setupIframeActivityDetection() {
      // Coba setup postMessage communication dengan iframe
      window.addEventListener('message', function(event) {
        if (event.data === 'userActivity') {
          resetAutoLogoutTimer();
        }
      });
      
      // Juga coba attach event listeners ke iframe setelah load
      mainFrame.addEventListener('load', function() {
        try {
          // Coba kirim script ke iframe untuk mendeteksi aktivitas
          const script = `
            <script>
              const activityEvents = ['mousedown', 'mousemove', 'keydown', 'click', 'scroll', 'touchstart', 'input', 'change'];
              activityEvents.forEach(event => {
                document.addEventListener(event, () => {
                  window.parent.postMessage('userActivity', '*');
                }, { passive: true });
              });
            <\/script>
          `;
          
          mainFrame.contentDocument.open();
          mainFrame.contentDocument.write(script);
          mainFrame.contentDocument.close();
        } catch (e) {
          // Cross-origin error, gunakan interval checking sebagai fallback
          console.log('Menggunakan fallback untuk deteksi aktivitas iframe');
          startIframeFallbackDetection();
        }
      });
    }

    // Fallback detection untuk iframe cross-origin
    function startIframeFallbackDetection() {
      let lastIframeSrc = mainFrame.src;
      setInterval(() => {
        if (mainFrame.src !== lastIframeSrc) {
          lastIframeSrc = mainFrame.src;
          resetAutoLogoutTimer();
        }
      }, 1000);
    }

    // Fungsi untuk memulai timer auto-logout
    function startAutoLogoutTimer() {
      if (!isLoggedIn) return;
      
      clearTimeout(inactivityTimer);
      clearInterval(countdownInterval);
      
      remainingTime = AUTO_LOGOUT_TIMEOUT;
      lastActivityTime = Date.now();
      updateTimerDisplay();
      
      countdownInterval = setInterval(updateTimerDisplay, 1000);
      
      inactivityTimer = setTimeout(() => {
        showAutoLogoutWarning();
      }, AUTO_LOGOUT_TIMEOUT);
    }

    // Fungsi untuk reset timer saat ada aktivitas
    function resetAutoLogoutTimer() {
      if (!isLoggedIn) return;
      
      lastActivityTime = Date.now();
      remainingTime = AUTO_LOGOUT_TIMEOUT;
      updateTimerDisplay();
      
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        showAutoLogoutWarning();
      }, AUTO_LOGOUT_TIMEOUT);
    }

    // Fungsi untuk update tampilan timer
    function updateTimerDisplay() {
      if (!timerDisplay || !isLoggedIn) return;
      
      remainingTime -= 1000;
      
      if (remainingTime <= 0) {
        timerDisplay.textContent = '00:00';
        timerDisplay.classList.add('timer-warning');
        return;
      }
      
      const minutes = Math.floor(remainingTime / 60000);
      const seconds = Math.floor((remainingTime % 60000) / 1000);
      
      timerDisplay.textContent = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      if (remainingTime <= 60000) {
        timerDisplay.classList.add('timer-warning');
      } else {
        timerDisplay.classList.remove('timer-warning');
      }
    }

    // Fungsi untuk menampilkan peringatan auto-logout
    function showAutoLogoutWarning() {
      if (!isLoggedIn) return;
      
      Swal.fire({
        title: '⏰ Sesi Akan Berakhir',
        html: `
          <div style="text-align: center;">
            <p style="font-size: 16px; margin-bottom: 20px;">
              Tidak ada aktivitas selama 10 menit. Sesi akan berakhir dalam:
            </p>
            <div style="font-size: 32px; font-weight: bold; color: #e74c3c; margin: 20px 0;">
              00:30
            </div>
            <p style="font-size: 14px; color: #666;">
              Klik "Lanjutkan" untuk tetap masuk
            </p>
          </div>
        `,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Lanjutkan',
        cancelButtonText: 'Keluar',
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        reverseButtons: true,
        allowOutsideClick: false,
        allowEscapeKey: false,
        timer: 30000, // 30 detik untuk merespons
        timerProgressBar: true,
        didOpen: () => {
          // Countdown dalam modal
          let warningTime = 30;
          const countdownEl = Swal.getHtmlContainer().querySelector('div[style*="font-size: 32px"]');
          
          const warningInterval = setInterval(() => {
            warningTime--;
            countdownEl.textContent = `00:${warningTime.toString().padStart(2, '0')}`;
            
            if (warningTime <= 10) {
              countdownEl.style.color = '#ff6b6b';
            }
            
            if (warningTime <= 0) {
              clearInterval(warningInterval);
              performAutoLogout();
            }
          }, 1000);
          
          // Simpan interval untuk cleanup
          Swal.getPopup().setAttribute('data-interval', warningInterval);
        },
        willClose: () => {
          const interval = Swal.getPopup().getAttribute('data-interval');
          if (interval) clearInterval(interval);
        }
      }).then((result) => {
        if (result.isConfirmed) {
          // User ingin lanjut
          resetAutoLogoutTimer();
          showToast('Sesi diperpanjang');
        } else if (result.dismiss === Swal.DismissReason.timer || 
                   result.dismiss === Swal.DismissReason.cancel) {
          // Timeout atau user memilih keluar
          performAutoLogout();
        }
      });
    }

    // Fungsi untuk melakukan auto-logout
    function performAutoLogout() {
      // Hentikan semua timer
      clearTimeout(inactivityTimer);
      clearInterval(countdownInterval);
      
      // Tampilkan notifikasi logout
      Swal.fire({
        title: 'Sesi Berakhir',
        text: 'Anda telah keluar otomatis karena tidak ada aktivitas',
        icon: 'info',
        timer: 2000,
        showConfirmButton: false,
        allowOutsideClick: false
      }).then(() => {
        // Logout
        isLoggedIn = false;
        localStorage.removeItem('isLoggedIn');
        showLogin();
      });
    }

    // Fungsi untuk menampilkan toast notifikasi
    function showToast(message) {
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        didOpen: (toast) => {
          toast.addEventListener('mouseenter', Swal.stopTimer);
          toast.addEventListener('mouseleave', Swal.resumeTimer);
        }
      });
      
      Toast.fire({
        icon: 'success',
        title: message
      });
    }

    // Toggle show/hide password
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🔒';
    });

    // Login dengan Enter key
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loginBtn.click();
      }
    });

    // Proses login
    loginBtn.addEventListener('click', () => {
      const password = passwordInput.value.trim();
      
      if (!password) {
        showError('Password tidak boleh kosong');
        return;
      }
      
      showLoading(true);
      errorMessage.textContent = '';
      
      setTimeout(() => {
        if (password === VALID_PASSWORD) {
          // Login berhasil
          isLoggedIn = true;
          localStorage.setItem('isLoggedIn', 'true');
          showContent();
          startAutoLogoutTimer();
          showLoading(false);
          
          // Tampilkan notifikasi sukses
          Swal.fire({
            title: 'Login Berhasil!',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          });
        } else {
          // Login gagal
          showError('Password salah. Coba lagi.');
          showLoading(false);
          passwordInput.value = '';
          passwordInput.focus();
          
          passwordInput.style.animation = 'none';
          setTimeout(() => {
            passwordInput.style.animation = 'shake 0.5s';
          }, 10);
        }
      }, 800);
    });

    // Logout manual
    logoutBtn.addEventListener('click', () => {
      Swal.fire({
        title: 'Konfirmasi Logout',
        text: 'Apakah Anda yakin ingin keluar?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Keluar',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        reverseButtons: true
      }).then((result) => {
        if (result.isConfirmed) {
          // Hentikan semua timer
          clearTimeout(inactivityTimer);
          clearInterval(countdownInterval);
          
          // Logout
          isLoggedIn = false;
          localStorage.removeItem('isLoggedIn');
          showLogin();
          
          // Tampilkan notifikasi
          Swal.fire({
            title: 'Berhasil Logout',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          });
        }
      });
    });

    // Fungsi untuk menampilkan konten
    function showContent() {
      loginScreen.style.display = 'none';
      contentScreen.style.display = 'block';
      
      timerDisplay.textContent = '10:00';
      timerDisplay.classList.remove('timer-warning');
      
      mainFrame.src = mainFrame.src + '?t=' + new Date().getTime();
    }

    // Fungsi untuk menampilkan login screen
    function showLogin() {
      contentScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      passwordInput.value = '';
      errorMessage.textContent = '';
      passwordInput.focus();
    }

    // Fungsi untuk menampilkan error
    function showError(message) {
      errorMessage.textContent = message;
    }

    // Fungsi untuk menampilkan/ menyembunyikan loading
    function showLoading(show) {
      loading.style.display = show ? 'block' : 'none';
      loginBtn.disabled = show;
    }

    // Auto focus ke input password
    passwordInput.focus();

    // Tambahkan CSS untuk animasi
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
